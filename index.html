const EXTRA=[10200,11140];
const GEN="var(--gen)",RES="var(--res)";
let mode="all";const cells=[];
const fmt=n=>{n=Math.round(n*100)/100;return n.toLocaleString("uk-UA",Number.isInteger(n)?{maximumFractionDigits:0}:{minimumFractionDigits:2,maximumFractionDigits:2})+" грн";};
const plural=(n,f)=>{const a=n%100,b=n%10;return a>10&&a<20?f[2]:b===1?f[0]:b>1&&b<5?f[1]:f[2]};
const kv=n=>n+" "+plural(n,["квартира","квартири","квартир"]);
function describe(c){const g=c.v&1,r=c.v&2;
  return "Квартира "+c.a+", "+c.f+" поверх: "+(g&&r?"генератор і резерв ліфта":g?"генератор":r?"резерв ліфта":"ще не долучилась");}
function build(){
  const city=document.getElementById("city");let tot=0,g=0,r=0,b=0;
  const maxF=Math.max(...D.map(([,fl])=>Math.max(...Object.keys(fl).map(Number))));
  const sc=document.createElement("div");sc.className="bld scale";sc.setAttribute("aria-hidden","true");
  sc.innerHTML='<div class="blbl"><b>0</b></div>';const sb=document.createElement("div");sb.className="body";
  for(let f=maxF;f>=1;f--){const r=document.createElement("div");r.className="fl";r.innerHTML="<span>"+f+"</span>";sb.appendChild(r);}
  const sd=document.createElement("div");sd.className="door";sb.appendChild(sd);sc.appendChild(sb);city.appendChild(sc);
  D.forEach(([s,fl])=>{
    const top=Math.max(...Object.keys(fl).map(Number));
    const floors=[];for(let f=top;f>=1;f--)floors.push(f);

    const lbl=document.createElement("div");lbl.className="blbl";lbl.id="lbl"+s;bld.appendChild(lbl);
    const body=document.createElement("div");body.className="body";
    floors.forEach(f=>{const row=document.createElement("div");row.className="fl";

        w.setAttribute("aria-label","Квартира "+a);
        if(v&1){const i=document.createElement("i");i.style.background=GEN;i.dataset.k="g";w.appendChild(i);}
        if(v&2){const i=document.createElement("i");i.style.background=RES;i.dataset.k="r";w.appendChild(i);}
        const num=document.createElement("span");num.textContent=a;w.appendChild(num);
        const c={a,v,s,f,el:w};cells.push(c);w.title=describe(c);
        row.appendChild(w);});
      body.appendChild(row);});
    const door=document.createElement("div");door.className="door";body.appendChild(door);
    bld.appendChild(body);city.appendChild(bld);});

  (document.getElementById("sRes")||{}).textContent=r+" з "+tot;

}
function apply(){
  cells.forEach(c=>{let lit=false;c.el.querySelectorAll("i").forEach(i=>{const off=(mode==="gen"&&i.dataset.k==="r")||(mode==="res"&&i.dataset.k==="g");i.style.display=off?"none":"";if(!off)lit=true;});c.el.classList.toggle("lit",lit);});
  D.forEach(([s])=>{const cs=cells.filter(c=>c.s===s);
    const on=cs.filter(c=>mode==="all"?c.v>0:mode==="gen"?(c.v&1):(c.v&2)).length;

let selEl=null;
function closePop(){pop.hidden=true;if(selEl)selEl.classList.remove("sel");selEl=null;}
function line(color,label,amt,date){
  if(!amt)return '<div class="row no"><i class="dot" style="background:var(--off)"></i><span>'+label+'</span><b>не скидали</b></div>';
  return '<div class="row"><i class="dot" style="background:'+color+'"></i><span>'+label+'</span><b>'+fmt(amt)+'</b>'+(date?'<small>'+(date.indexOf(",")>0?"Дати внесків: ":"Дата внеску: ")+date+'</small>':'')+'</div>';}
function openPop(c){
  const p=PAY[c.a]||[0,"",0,""];
  pop.innerHTML='<button type="button" class="x" aria-label="Закрити">×</button><h3>Квартира '+c.a+'</h3><div class="sub">Секція '+c.s+', '+c.f+' поверх</div>'

  pop.style.left=left+"px";pop.style.top=top+"px";}

build();apply();

cells.forEach(c=>{c.el.removeAttribute("title");c.el.addEventListener("click",()=>{if(selEl===c.el){closePop();return;}openPop(c);});});
